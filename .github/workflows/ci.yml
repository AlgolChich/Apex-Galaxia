name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint, build, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test the CLI from a clean build
        shell: bash
        run: |
          node packages/cli/dist/bin.js --version
          node packages/cli/dist/bin.js new "$RUNNER_TEMP/smoke-ru" --title "Проба" --lang ru
          node packages/cli/dist/bin.js lint evals/fault-set/tells.ru.md --lang ru --json > /dev/null
          node packages/cli/dist/bin.js open "$RUNNER_TEMP/smoke-ru"
