[package]
name = "apex-galaxia"
version = "0.1.0"
description = "Apex Galaxia desktop shell: a Tauri 2 window around the MCP sidecar (ADR 0010)."
authors = ["Apex Galaxia contributors"]
license = "MIT"
repository = "https://github.com/algolchich/apex-galaxia"
edition = "2021"
rust-version = "1.90"

[lib]
name = "apex_galaxia_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The platform-native stores: each feature only compiles on its own target.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
