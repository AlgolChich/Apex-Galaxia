name: Release

# A version tag (v0.1.0, v1.0.0-rc.1) builds the installers for the three platforms and attaches
# them to a draft GitHub release whose notes come from docs/release-notes/<tag>.md (Russian and
# English). Code signing runs only when the secrets exist (docs/release.md); unsigned builds are
# still attached so the Author can test them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the Tauri 2 prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Bundle the sidecar and fetch the Node runtime for this target
        shell: bash
        run: |
          pnpm --filter @apex-galaxia/desktop sidecar:bundle
          pnpm --filter @apex-galaxia/desktop sidecar:node
      - name: Release notes for this tag
        id: notes
        shell: bash
        run: |
          FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$FILE" ]; then echo "file=$FILE" >> "$GITHUB_OUTPUT"; else echo "file=docs/release-notes/TEMPLATE.md" >> "$GITHUB_OUTPUT"; fi
      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization (optional; see docs/release.md)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode through Azure Trusted Signing (optional)
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Apex Galaxia ${{ github.ref_name }}'
          releaseBodyPath: ${{ steps.notes.outputs.file }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
